name: Build DriFly Offline Brazil Map Packs

# Ready-to-paste GitHub Actions workflow for `andrefonn/drifly-maps`.
# To activate: copy this file to `.github/workflows/build-packs.yml` in
# `andrefonn/drifly-maps` (requires `gh auth refresh -h github.com -s workflow`
# or creating it once in the GitHub Web UI).

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated UF codes (e.g. pa,sc,sp) or 'all' for all 27 Brazilian states"
        required: true
        default: "pa"
      release_tag:
        description: "GitHub Release tag for map packs"
        required: true
        default: "map-packs-v1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        shell: python
        env:
          INPUT_REGIONS: ${{ inputs.regions }}
        run: |
          import json, os
          from pathlib import Path
          data = json.loads(Path("scripts/map-pack/states_br.json").read_text(encoding="utf-8"))
          all_states = [r["id"] for r in data["regions"] if r["kind"] == "state"]
          raw = os.environ["INPUT_REGIONS"].strip().lower()
          selected = all_states if raw == "all" else [x.strip() for x in raw.split(",") if x.strip()]
          valid = {r["id"] for r in data["regions"]}
          unknown = [x for x in selected if x not in valid]
          if unknown:
              raise SystemExit(f"Unknown regions: {unknown}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(selected)}\n")

  build-pack:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install osmium-tool, pyosmium, and pmtiles CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool curl
          python3 -m pip install --quiet osmium
          curl -fsSL -o /tmp/pmtiles.tar.gz \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/pmtiles.tar.gz -C /usr/local/bin pmtiles
          rm -f /tmp/pmtiles.tar.gz
          osmium --version
          pmtiles --help | head -n 3

      - name: Build offline pack (${{ matrix.region }})
        run: |
          python3 scripts/map-pack/build_all.py \
            --region "${{ matrix.region }}" \
            --out-dir "out/${{ matrix.region }}" \
            --work-dir "/tmp/drifly-work" \
            --release-repo "${{ github.repository }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --clean-intermediates
          ls -lh "out/${{ matrix.region }}/${{ matrix.region }}-pack-v1.zip"
          df -h

      - name: Upload pack & sidecar metadata to Release ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "DriFly Offline Map Packs v1" --notes "100% offline Brazilian state & city packs (OSM ODbL / Protomaps)."
          gh release upload "$TAG" \
            "out/${{ matrix.region }}/${{ matrix.region }}-pack-v1.zip" \
            "out/${{ matrix.region }}/${{ matrix.region }}-pack-v1.meta.json" \
            --clobber

  publish-catalog:
    needs: build-pack
    if: always() && (needs.build-pack.result == 'success' || needs.build-pack.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all sidecar metadata & regenerate catalog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/catalog-meta
          TAG="${{ inputs.release_tag }}"
          gh release download "$TAG" --pattern "*-pack-v*.meta.json" --dir /tmp/catalog-meta || true
          gh release download "$TAG" --pattern "manifest.json" --dir /tmp/catalog-meta || true
          python3 scripts/map-pack/build_catalog.py \
            --regions-file scripts/map-pack/states_br.json \
            --meta-dir /tmp/catalog-meta \
            --out /tmp/catalog.json
          gh release upload "$TAG" /tmp/catalog.json --clobber
